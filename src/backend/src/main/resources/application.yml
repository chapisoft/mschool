server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: mschool-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mschool_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms

app:
  miai:
    base-url: ${MIAI_BASE_URL:http://localhost:8000/api/v1}
    timeout-ms: 5000
  attendance:
    gate-cooldown-seconds: 90
    morning-late-cutoff: "07:30"
    afternoon-departure-start: "16:00"
    short-leave-max-minutes: 5
  outbox:
    polling-interval-ms: 1000
    batch-size: 50
    max-retries: 5
  webhook:
    timeout-ms: 3000
    max-retries: 3
    retry-delay-ms: 1000
