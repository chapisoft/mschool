version: '3.8'

services:
  # 1. Cơ sở dữ liệu quan hệ PostgreSQL 16 tích hợp pgvector
  mschool-postgres:
    image: pgvector/pgvector:pg16
    container_name: mschool-postgres
    restart: always
    environment:
      POSTGRES_DB: mschool_db
      POSTGRES_USER: mschool_admin
      POSTGRES_PASSWORD: SecretCampusPassword2026!
    volumes:
      - mschool_pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    networks:
      - mschool-network

  # 2. Bộ nhớ đệm phân tán Redis Cache 7.x
  mschool-redis:
    image: redis:7-alpine
    container_name: mschool-redis
    restart: always
    command: redis-server --appendonly yes --requirepass SecretRedisPass2026!
    volumes:
      - mschool_redisdata:/data
    ports:
      - "6379:6379"
    networks:
      - mschool-network

  # 3. Nền tảng Trí tuệ Nhân tạo Core AI (miai)
  miai-core:
    build:
      context: /Users/micro/Source/miai/src
      dockerfile: Dockerfile
    container_name: miai-core
    restart: always
    environment:
      APP_ENV: production
      SERVER_PORT: 8000
      AUTH_API_KEY: miai-secret-key-prod
      REDIS_HOST: mschool-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: SecretRedisPass2026!
      DATABASE_URL: postgresql+asyncpg://mschool_admin:SecretCampusPassword2026!@mschool-postgres:5432/mschool_db
    ports:
      - "8000:8000"
    depends_on:
      - mschool-postgres
      - mschool-redis
    networks:
      - mschool-network

  # 4. Tiến trình Thu nhận Luồng Camera Ingestion Worker
  mschool-camera-worker:
    build:
      context: ../services/camera-worker
      dockerfile: Dockerfile
    container_name: mschool-camera-worker
    restart: always
    network_mode: host
    environment:
      MIAI_API_URL: http://127.0.0.1:8000/api/v1
      MIAI_API_KEY: miai-secret-key-prod
      MSCHOOL_BACKEND_URL: http://127.0.0.1:8080/api/v1
      EDIF_FIQA_THRESHOLD: "0.85"
      MAX_TRACK_DURATION_SEC: "0.80"
    depends_on:
      - miai-core

  # 5. Máy chủ Nghiệp vụ Backend Spring Boot
  mschool-backend:
    image: eclipse-temurin:21-jre-alpine
    container_name: mschool-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://mschool-postgres:5432/mschool_db
      SPRING_DATASOURCE_USERNAME: mschool_admin
      SPRING_DATASOURCE_PASSWORD: SecretCampusPassword2026!
      SPRING_DATA_REDIS_HOST: mschool-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: SecretRedisPass2026!
      MIAI_CORE_URL: http://miai-core:8000/api/v1
    ports:
      - "8080:8080"
    depends_on:
      - mschool-postgres
      - mschool-redis
      - miai-core
    networks:
      - mschool-network

  # 6. Giao diện Quản trị Web CMS Next.js 14
  mschool-cms:
    image: node:20-alpine
    container_name: mschool-cms
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8080/api/v1
      NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8080/ws
    ports:
      - "3000:3000"
    depends_on:
      - mschool-backend
  # 7. Cổng Cân bằng Tải Nginx Reverse Proxy
  mschool-gateway:
    image: nginx:alpine
    container_name: mschool-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mschool-backend
      - mschool-cms
    networks:
      - mschool-network

  # 8. Lưu trữ Đối tượng MinIO S3 Object Storage
  mschool-minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: mschool-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: SecretMinioPassword2026!
    volumes:
      - mschool_miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - mschool-network

networks:
  mschool-network:
    driver: bridge

volumes:
  mschool_pgdata:
    driver: local
  mschool_redisdata:
    driver: local
  mschool_miniodata:
    driver: local
